# Opciones de la JVM para el demonio de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila en paralelo y reutiliza el demonio para acelerar las builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (obligatorio para Compose y librerías modernas).
android.useAndroidX=true

# Kotlin code style oficial.
kotlin.code.style=official

# Genera solo los recursos R de cada módulo (builds más rápidas).
android.nonTransitiveRClass=true
